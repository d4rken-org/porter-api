name: SDK validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: SDK validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 #v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 #v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c #v5.0.2
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew :sdk:testDebugUnitTest :sdk-extras:testDebugUnitTest
      - name: Check the published ABI against its baseline
        run: ./gradlew apiCheck
      # Error-severity issues fail the build, which is what catches a call the minimum SDK lacks.
      - name: Android lint
        run: ./gradlew :protocol:lintDebug :sdk:lintDebug :sdk-extras:lintDebug :shizuku-compat:lintDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-sdk-unit-tests
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
      - name: Publish SDK locally
        run: ./gradlew -Dmaven.repo.local="$RUNNER_TEMP/porter-maven" publishToMavenLocal
      - name: Check publication metadata
        run: python3 tools/verify-publication.py "$RUNNER_TEMP/porter-maven" 0.2.0
      - name: Build independent consumer
        run: ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" assembleDebug
      - name: Build a consumer with the extras artifact
        run: ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" -PwithExtras=true assembleDebug
      - name: Build a dual-SDK consumer
        run: ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" -PwithLegacySdk=true assembleDebug
      - name: Build a minified consumer with the compatibility artifact
        run: ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" -PwithCompat=true assembleRelease
      - name: Check the compatibility class survived R8
        run: |
          apk=$(ls tests/consumer/build/outputs/apk/release/*.apk)
          # The dex is binary, so grep only reports the match when -a makes it treat the stream as text.
          unzip -p "$apk" 'classes*.dex' | grep -qa 'moe/shizuku/api/BinderContainer'
      # Both release consumer builds write the same APK path and the check above selects by glob,
      # so this step has to stay after it.
      - name: Build a minified consumer without the compatibility artifact
        run: ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" assembleRelease

  shell:
    name: Porsh shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 #v5.7.0
        with:
          distribution: temurin
          # :porsh and :server-shared compile at source level 21.
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 #v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c #v5.0.2
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.0"
      - name: Build and test the shell
        run: ./gradlew -PincludeShell=true :porsh:assembleDebug :porsh:assembleRelease :porsh:testDebugUnitTest :server-shared:assembleRelease :server-shared:testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porsh-unit-tests
          path: |
            porsh/build/test-results/**/*.xml
            porsh/build/reports/tests/**
            server-shared/build/test-results/**/*.xml
            server-shared/build/reports/tests/**
          if-no-files-found: warn

  wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

  instrumented:
    name: Instrumented tests (Android ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The oldest release the SDK supports, for the native load, and the newest, whose non-SDK
        # interface enforcement decides whether the reflective service lookup still resolves.
        api: [24, 36]
        include:
          # The API 24 image panics in goldfish_dma_mmap about 20s into boot unless GL DMA is off.
          - api: 24
            features: -feature -GLDMA,-GLDMA2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 #v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 #v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c #v5.0.2
      - name: Install Android SDK
        env:
          EMULATOR_API: ${{ matrix.api }}
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.0" emulator "system-images;android-$EMULATOR_API;google_apis;x86_64"
      - name: Build the test APKs
        run: ./gradlew -PincludeShell=true :porsh:assembleDebugAndroidTest :sdk-extras:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d #v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none ${{ matrix.features }}
          disable-animations: true
          script: ./gradlew -PincludeShell=true :porsh:connectedDebugAndroidTest :sdk-extras:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-instrumented-api-${{ matrix.api }}
          path: |
            porsh/build/outputs/androidTest-results/**
            sdk-extras/build/outputs/androidTest-results/**
            porsh/build/reports/androidTests/**
            sdk-extras/build/reports/androidTests/**
          if-no-files-found: warn
