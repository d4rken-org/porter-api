name: SDK validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 #v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 #v3.2.2
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c #v5.0.2
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew :client:testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: porter-sdk-unit-tests
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
      - name: Publish SDK locally
        run: ./gradlew -Dmaven.repo.local="$RUNNER_TEMP/porter-maven" publishToMavenLocal
      - name: Check publication metadata
        run: python3 tools/verify-publication.py "$RUNNER_TEMP/porter-maven" 0.1.0
      - name: Build independent consumer
        run: ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" assembleDebug
      - name: Reject a mixed upstream SDK graph
        shell: bash
        run: |
          if ./gradlew -p tests/consumer -PsdkRepository="$RUNNER_TEMP/porter-maven" -PwithLegacySdk=true assembleDebug > "$RUNNER_TEMP/conflict.log" 2>&1; then
            echo "Mixed SDK dependencies unexpectedly resolved"
            exit 1
          fi
          cat "$RUNNER_TEMP/conflict.log"
          grep -q 'conflict on capability' "$RUNNER_TEMP/conflict.log"

  wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0
