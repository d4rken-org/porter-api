plugins {
    id "com.android.library" apply false
}

apply from: "manifest.gradle"

def sdkVersion = providers.gradleProperty("version")
        .orElse(providers.environmentVariable("VERSION")).getOrElse("0.2.0")
def publishedModules = ["protocol", "sdk", "shizuku-compat"]
def licenseDetails = [
        "Apache-2.0": ["Apache License 2.0", "https://www.apache.org/licenses/LICENSE-2.0"],
        "MIT"       : ["MIT License", "https://opensource.org/license/mit"],
]
// sdk carries MIT next to Apache-2.0 because some of its classes derive from the
// upstream Shizuku API; shizuku-compat is upstream code and is MIT alone.
def moduleLicenses = [
        "protocol"      : ["Apache-2.0"],
        "sdk"           : ["Apache-2.0", "MIT"],
        "shizuku-compat": ["MIT"],
]

allprojects {
    group = "com.github.d4rken-org.porter-api"
    version = sdkVersion
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_11
                targetCompatibility = JavaVersion.VERSION_11
            }
        }
    }
    plugins.withId("com.android.library") {
        if (!publishedModules.contains(subproject.name)) return
        subproject.pluginManager.apply("maven-publish")
        android.publishing {
            singleVariant("release") { withSourcesJar() }
        }
        afterEvaluate {
            publishing {
                publications {
                    release(MavenPublication) {
                        from components.release
                        pom {
                            name = "Porter SDK - ${subproject.name}"
                            description = "Porter Android SDK"
                            url = "https://github.com/d4rken-org/porter-api"
                            licenses {
                                moduleLicenses[subproject.name].each { id ->
                                    def details = licenseDetails[id]
                                    license {
                                        name = details[0]
                                        url = details[1]
                                    }
                                }
                            }
                            scm {
                                url = "https://github.com/d4rken-org/porter-api"
                                connection = "scm:git:https://github.com/d4rken-org/porter-api.git"
                            }
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) { delete rootProject.layout.buildDirectory }
