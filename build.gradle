plugins {
    id "com.android.library" apply false
}

apply from: "manifest.gradle"

def sdkVersion = providers.gradleProperty("version")
        .orElse(providers.environmentVariable("VERSION")).getOrElse("0.1.0")
def publishedModules = ["aidl", "shared", "api", "provider", "client"]

allprojects {
    group = "com.github.d4rken-org.porter-api"
    version = sdkVersion
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_11
                targetCompatibility = JavaVersion.VERSION_11
            }
        }
    }
    plugins.withId("com.android.library") {
        if (!publishedModules.contains(subproject.name)) return
        subproject.pluginManager.apply("maven-publish")
        android.publishing {
            singleVariant("release") { withSourcesJar() }
        }
        if (subproject.name != "client") {
            configurations.matching {
                it.name in ["releaseApiElements", "releaseRuntimeElements"] ||
                        it.name.endsWith("ApiPublication") || it.name.endsWith("RuntimePublication")
            }.configureEach {
                outgoing.capability("${subproject.group}:${subproject.name}:${subproject.version}")
                outgoing.capability("dev.rikka.shizuku:${subproject.name}:${subproject.version}")
            }
        }
        afterEvaluate {
            publishing {
                publications {
                    release(MavenPublication) {
                        from components.release
                        pom {
                            name = "Porter SDK - ${subproject.name}"
                            description = "Porter and Shizuku compatible Android SDK"
                            url = "https://github.com/d4rken-org/porter-api"
                            licenses {
                                license {
                                    name = subproject.name == "client" ? "Apache License 2.0" : "MIT License"
                                    url = subproject.name == "client"
                                            ? "https://www.apache.org/licenses/LICENSE-2.0"
                                            : "https://opensource.org/license/mit"
                                }
                            }
                            scm {
                                url = "https://github.com/d4rken-org/porter-api"
                                connection = "scm:git:https://github.com/d4rken-org/porter-api.git"
                            }
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) { delete rootProject.layout.buildDirectory }
