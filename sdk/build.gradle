plugins {
    id("com.android.library")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "eu.darken.porter.sdk"
    defaultConfig {
        consumerProguardFiles = ["consumer-rules.pro"]
    }
    buildFeatures {
        buildConfig = false
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Pinned here rather than in the root script: the app includes this module directly and never
// applies that script, so the two targets have to agree from this file alone.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    api project(":protocol")

    // Optional and non-transitive: only an app that declares PorterShizukuApiProvider needs it.
    compileOnly project(":shizuku-compat")

    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    implementation "androidx.annotation:annotation:1.3.0"

    // Test-only: the generated Shizuku stubs decode what the Shizuku wire encodes by hand, and
    // ShizukuApiConstants is where the key strings ShizukuProtocol copies are pinned against.
    testImplementation project(":aidl")
    testImplementation project(":shared")
    testImplementation project(":shizuku-compat")
    // Test-only: the manager package and the permission it declares are spelled in
    // rikka.shizuku.ShizukuProvider, which is where a mistyped copy of them is caught.
    testImplementation project(":provider")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
}
